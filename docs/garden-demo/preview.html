  appEl.innerHTML = `<nav class="rail" aria-label="${esc(C.project)}">${railHTML()}</nav><main class="view" id="view"></main><aside class="insp" id="insp" aria-label="Inspector" hidden></aside><div class="zoom" id="zoom" role="dialog" aria-label="Picture" data-unzoom hidden></div>`;
  document.getElementById("app").replaceWith(appEl);
  const view = appEl.querySelector("#view"), insp = appEl.querySelector("#insp"), zoom = appEl.querySelector("#zoom");
  let spyFrame = 0;
  view.addEventListener("scroll", () => { spyFrame ||= requestAnimationFrame(() => { spyFrame = 0; spy(); }); }, { passive: true });

  document.addEventListener("click", (event) => {
    const el = event.target.closest("[data-zoom],[data-open],[data-view],[data-crumb],[data-trail],[data-close],[data-sort],[data-filter],[data-shot],[data-unzoom],[data-seq],[data-ch],[data-switch],[data-tally]");
    if (!el) return;
    const s = read(), d = el.dataset;
    pressed = view.contains(el) ? el : null;
    if (d.zoom !== undefined) go({ z: d.zoom });
    else if (d.unzoom !== undefined) { if (!event.target.closest("img")) go({}); }
    else if (d.view !== undefined) {
      event.preventDefault();
      const keep = el.hasAttribute("data-keep");
      go({ view: d.view, from: el.hasAttribute("data-push") ? pathTo(s, d.view) : [], i: keep ? s.i : "", t: keep ? s.t : [], f: "", s: "", c: "", w: [] });
    } else if (d.open !== undefined) {
      event.preventDefault();
      if (d.open !== s.i) go({ i: d.open, t: el.closest("#insp") && s.i ? [...s.t, s.i] : [] });
    } else if (d.crumb !== undefined) go({ view: s.from[+d.crumb], from: s.from.slice(0, +d.crumb), i: "", t: [], f: "", s: "", c: "", w: [] });
    else if (d.trail !== undefined) go({ i: s.t[+d.trail], t: s.t.slice(0, +d.trail) });
    else if (d.seq !== undefined) go({ s: d.seq.endsWith("~0") ? "" : d.seq });
    else if (d.ch !== undefined) {
      event.preventDefault();
      /* In tabs a switch belongs to the chapter on screen, so what was picked in it does not carry over. */
      const tabbed = D.pages[s.view]?.layout === "tabs";
      /* The chapter being read is already in the address, so pressing its name goes to its top without a new step. */
      if (!tabbed && (s.c || "start") === d.ch) jump(d.ch, true);
      else go({ c: d.ch, ...(tabbed ? { w: [], s: "" } : {}) });
    } else if (d.switch !== undefined) go({ w: [...s.w.filter((pair) => !pair.startsWith(`${d.switch.split("~")[0]}~`)), ...(d.switch.endsWith("~0") ? [] : [d.switch])] });
    else if (d.close !== undefined) go({ i: "", t: [] });
    else if (d.shot !== undefined) {
      const figure = el.closest(".shots");
      figure.querySelectorAll("[data-shot]").forEach((b) => b.toggleAttribute("data-on", b === el));
      figure.querySelectorAll("[data-shot-pane]").forEach((p) => { p.hidden = p.dataset.shotPane !== d.shot; });
    } else if (d.tally !== undefined) {
      /* The list of that type is a chapter of this page, or a view of its own. */
      const [type, label] = d.tally.split("~"), keeps = C.types[type]?.index?.filter === "status" ? label : "";
      const chapter = D.pages[s.view] && chaptersOf(s.view).list.find((ch) => tagsIn(ch.html, "index").some((tag) => tag.includes(`type="${type}"`)));
      if (chapter) go({ c: chapter.id, f: keeps, ...(D.pages[s.view].layout === "tabs" ? { w: [], s: "" } : {}) });
      else if (C.types[type]?.index) go({ view: `index/${type}`, from: pathTo(s, `index/${type}`), i: "", t: [], f: keeps, s: "", c: "", w: [] });
    } else if (d.filter !== undefined) go({ f: d.filter === s.f ? "" : d.filter });
    else {
      const st = ix[d.type];
      st.dir = st.sort === d.sort ? -st.dir : 1; st.sort = d.sort;
      el.closest("fw-index").innerHTML = indexBody(d.type);
      light(read());
    }
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && read().z) go({});
    else if (event.key === "Escape" && read().i) go({ i: "", t: [] });
    if ((event.key === "Enter" || event.key === " ") && event.target.matches?.("[role=button], tr[data-open]")) { event.preventDefault(); event.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
  });
  /* Typing in a list's filter box redraws the list and puts the caret back where it was. */
  document.addEventListener("input", (event) => {
    const type = event.target.dataset?.find;
    if (!type) return;
    ix[type].q = event.target.value;
    const host = event.target.closest("fw-index"), at = event.target.selectionStart;
    host.innerHTML = indexBody(type);
    const box = host.querySelector("[data-find]");
    box.focus();
    box.setSelectionRange(at, at);
    light(read());
  });
  /* Pointing at a row in the inspector shows where that thing is in the view. */
  insp.addEventListener("mouseover", (event) => {
    const el = event.target.closest("[data-open]");
    appEl.querySelectorAll("[data-hint]").forEach((x) => x.removeAttribute("data-hint"));
    if (!el) return;
    const token = CSS.escape(el.dataset.open);
    appEl.querySelectorAll(`.view [data-open="${token}"], .mini [data-open="${token}"], .fstep[data-open="${token}"]`).forEach((x) => { if (x !== el) x.setAttribute("data-hint", ""); });
  });
  insp.addEventListener("mouseleave", () => appEl.querySelectorAll("[data-hint]").forEach((x) => x.removeAttribute("data-hint")));
  /* Finding opens the card beside the view; the view stays where it is. */
  const q = appEl.querySelector("#q"), found = appEl.querySelector("#found"), nav = appEl.querySelector("#nav");
  q.addEventListener("input", () => {
    const words = q.value.trim().toLowerCase();
    found.hidden = !words; nav.hidden = !!words;
    if (!words) return;
    const hits = Object.values(E).filter((e) => e.type !== "flow" && `${e.title} ${e.description ?? ""}`.toLowerCase().includes(words))
      .sort((a, b) => Number(b.title.toLowerCase().includes(words)) - Number(a.title.toLowerCase().includes(words))).slice(0, 14);
    found.innerHTML = hits.length ? hits.map((e) => `<button class="hit" data-open="${e.id}"><span>${mk(e)}${esc(e.title)}</span><i>${esc(C.types[e.type].label)}</i></button>`).join("") : `<p class="note">Nothing is named “${esc(q.value)}”.</p>`;
  });
  window.addEventListener("hashchange", render);
  /* The way in for answers.js, which draws questions and collects what the reader answers. */
  window.FW = { D, C, E, esc, md, rich, read, go, chip, mk, tone, evMark, view, hooks, chapterWith, redraw() { shown = ""; render(); } };
  render();
})();

</script>
<script>
/* Questions and answers. It draws what a page asks its reader (a choice between options, or a mark per line),
   keeps what the reader answers, and hands the answers back as one document: copied as a prompt, or sent to a
   watching Claude session where the page is published as an artifact. Nothing the reader does not touch counts
   as agreement: an untouched question is listed as unanswered, and an untouched choice takes its stated default.
   Colour here follows the page: ink marks what the reader pressed; no state colour is used for an answer. */
(() => {
  "use strict";
  const X = window.FW;
  if (!X) return;
  const { D, C, E, esc, md, rich, read, mk, chip } = X;
  const pageMode = D.mode === "page";
  /* Answers belong to one page under one title. A page that comes back with a new title is its next version and
     starts clean, so marks made on the last one are not counted against it. */
  const KEY = `fw-answers:${C.project}:${pageMode ? `${C.home}:${D.pages[C.home]?.title ?? ""}` : "site"}`;
  const VERDICTS = ["Right", "Wrong", "Unsure"];
  const GOAL = ["Right", "Not quite"];
  const slug = (label) => label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const state = { answers: {}, flags: [], general: "" };
  const touched = (a) => !!a && (!!a.v || !!a.note?.trim() || !!a.unclear);
  const count = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

  /* ---- What the pages ask ---- */
  const refOf = (el) => ({ id: el.getAttribute("id"), type: el.getAttribute("type"), status: el.getAttribute("status"), optional: el.getAttribute("mode") === "optional", choices: el.getAttribute("choices") });
  const askedBy = (ref) => Object.values(E).filter((e) => (ref.id ? e.id === ref.id : e.type === ref.type && (!ref.status || e.status === ref.status)));
  const choicesOf = (e, ref) => (ref.choices ? ref.choices.split(",").map((label) => label.trim()).filter(Boolean) : e.choices ?? VERDICTS);
  const goalId = (pageId) => (pageMode ? "goal" : `goal:${pageId}`);
  /* id -> what it is, for the answer document: every question on every page of this build, in reading order. */
  const registry = new Map();
  for (const [pageId, page] of Object.entries(D.pages)) {
    if (page.head?.goal) registry.set(goalId(pageId), { kind: "goal", label: page.head.goal, section: page.title, page: pageId, ask: true, labels: GOAL });
    const doc = new DOMParser().parseFromString(page.html, "text/html");
    let section = page.title;
    for (const el of doc.body.querySelectorAll("h2, fw-ask")) {
      if (el.tagName === "H2") { section = el.textContent.trim(); continue; }
      const ref = refOf(el);
      for (const e of askedBy(ref)) {
        if (e.answer || e.stub) continue;
        registry.set(e.id, e.options
          ? { kind: "choice", label: e.title, section, page: pageId, ask: !ref.optional, rec: e.rec, def: e.default, labels: e.options.map((o) => o.name), values: e.options.map((o) => o.id) }
          : { kind: "mark", label: e.title, section, page: pageId, ask: !ref.optional, labels: choicesOf(e, ref) });
      }
    }
  }
  const metaOf = (id) => registry.get(id) ?? (E[id]?.options
    ? { kind: "choice", label: E[id].title, section: C.types[E[id].type].plural, rec: E[id].rec, labels: E[id].options.map((o) => o.name), values: E[id].options.map((o) => o.id) }
    : { kind: "mark", label: E[id]?.title ?? id, section: E[id] ? C.types[E[id].type].plural : "", labels: E[id]?.choices ?? VERDICTS });
  const valueLabel = (meta, v) => (meta.values ? meta.labels[meta.values.indexOf(v)] : meta.labels.find((label) => slug(label) === v)) ?? v;

  /* ---- Drawing a question ---- */
  const seg = (id, labels) => `<span class="seg" role="group">${labels.map((label) => `<button data-mark="${slug(label)}"${state.answers[id]?.v === slug(label) ? " data-on" : ""}>${esc(label)}</button>`).join("")}</span>`;
  function foot(id) {
    const a = state.answers[id] ?? {};
    return `<div class="ask-foot"><button class="term" data-note-toggle>${a.note ? "Your note" : "Add a note"}</button>
      <label><input type="checkbox" data-unclear${a.unclear ? " checked" : ""}> This is unclear</label>
      <textarea data-note rows="2" placeholder="Your answer in your own words, or a note."${a.note ? "" : " hidden"}>${esc(a.note ?? "")}</textarea></div>`;
  }
  const UNDO = { easy: "Easy to undo", hard: "Hard to undo" };
  const optionBody = (e, o) => `<span class="opt-head"><i class="radio"></i><b>${esc(o.name)}</b>${o.id === e.rec && !e.answer ? "<em>Recommended</em>" : ""}</span>
    ${o.text ? `<span>${rich(o.text, e.id)}</span>` : ""}
    ${o.gets || o.costs || o.risk ? `<span class="trade">${[["You get", o.gets], ["It costs", o.costs], ["Main risk", o.risk]].filter(([, text]) => text).map(([name, text]) => `<span><i>${name}</i><span>${rich(text, e.id)}</span></span>`).join("")}</span>` : ""}
    ${o.undo ? `<span class="chip">${UNDO[o.undo] ?? esc(o.undo)}</span>` : ""}`;
  function choiceHTML(e) {
    const picked = state.answers[e.id]?.v, rec = e.options.find((o) => o.id === e.rec);
    if (e.answer) {
      const settled = e.options.find((o) => o.id === e.answer || o.name === e.answer);
      return `<article class="panel ask" data-settled><p class="kicker">${mk(e)}Decision${chip(e.status)}</p><h3>${rich(e.title, e.id)}</h3>
        <p class="why"><b>Settled:</b> ${rich(settled?.name ?? e.answer, e.id)}</p>
        <details><summary>The options that were weighed</summary><div class="opts">${e.options.map((o) => `<div class="opt"${o === settled ? " data-on" : ""}>${optionBody(e, o)}</div>`).join("")}</div></details></article>`;
    }
    return `<article class="panel ask" data-ask="${e.id}"><p class="kicker">${mk(e)}A question for you</p><h3>${rich(e.title, e.id)}</h3>
      ${e.description ? `<p class="lede">${rich(e.description, e.id)}</p>` : ""}
      <div class="opts">${e.options.map((o) => `<div class="opt" role="button" tabindex="0" data-pick="${esc(o.id)}"${picked === o.id ? " data-on" : ""} aria-pressed="${picked === o.id}">${optionBody(e, o)}</div>`).join("")}</div>
      <p class="why"><b>I recommend ${esc(rec?.name ?? "")}.</b> ${rich(e.rec_why ?? "", e.id)}${e.change_mind ? ` <i>What would change it:</i> ${rich(e.change_mind, e.id)}` : ""}</p>
      <p class="meta">If you do not answer: ${rich(e.default ?? "", e.id)}</p>${foot(e.id)}</article>`;
  }
  const more = (e) => e.body || e.steps || e.lists || e.links || e.facts || e.sides || e.shots;
  function markRow(e, ref) {
    if (e.answer) return `<div class="ask-row" data-settled><div><b>${rich(e.title, e.id)}</b><span class="meta">Settled: ${rich(e.answer, e.id)}</span></div>${chip(e.status)}</div>`;
    return `<div class="ask-row" data-ask="${e.id}"><div><b>${mk(e)}<span>${rich(e.title, e.id)}</span></b>${e.description ? `<span>${rich(e.description, e.id)}</span>` : ""}
      ${e.status || e.ev || more(e) ? `<span class="ask-meta">${chip(e.status)}${X.evMark(e)}${more(e) ? `<button class="term" data-open="${e.id}">Details</button>` : ""}</span>` : ""}</div>${seg(e.id, choicesOf(e, ref))}${foot(e.id)}</div>`;
  }
  function askBody(ref) {
    const asked = askedBy(ref).filter((e) => !e.stub);
    if (!asked.length) return `<p class="note">Nothing to ask here.</p>`;
    const choices = asked.filter((e) => e.options), marks = asked.filter((e) => !e.options);
    return choices.map(choiceHTML).join("") + (marks.length ? `<div class="panel asks">${marks.map((e) => markRow(e, ref)).join("")}</div>` : "");
  }
  customElements.define("fw-ask", class extends HTMLElement { connectedCallback() { this.innerHTML = askBody(refOf(this)); } });

  /* ---- The top of a page: what changes, the goal restated, what is needed, what happens with no answer ---- */
  X.hooks.pageHead = (pageId) => {
    const h = D.pages[pageId].head;
    /* The ground, the words to know and the figures are drawn by the page itself. This panel is what is asked. */
    if (!h || !["for_you", "goal", "asks", "if_no_answer", "confidence", "changed", "wrong_before", "written_for"].some((key) => h[key])) return "";
    const cell = (title, body, more = "") => `<div${more}><h3>${title}</h3>${body}</div>`;
    const lines = (list) => `<ul>${list.map((line) => `<li>${rich(line)}</li>`).join("")}</ul>`;
    const id = goalId(pageId);
    return `<section class="panel pagehead">
      ${h.for_you ? cell("What changes for you", `<p>${rich(h.for_you)}</p>`) : ""}
      ${h.goal ? cell("Your goal, as I understand it", `<p>${rich(h.goal)}</p><div class="ask-row">${seg(id, GOAL)}${foot(id)}</div>`, ` data-ask="${id}"`) : ""}
      ${h.asks ? cell("What I need from you", h.asks.length > 1 ? `<ol>${h.asks.map((line) => `<li>${rich(line)}</li>`).join("")}</ol>` : `<p>${rich(h.asks[0])}</p>`) : ""}
      ${h.if_no_answer ? cell("If you do not answer", `<p>${rich(h.if_no_answer)}</p>`) : ""}
      ${h.confidence ? cell("How sure I am", `<p>${rich(h.confidence)}</p>`) : ""}
      ${h.changed ? cell("Changed since the last page", lines(h.changed)) : ""}
      ${h.wrong_before ? cell("What I had wrong before", lines(h.wrong_before)) : ""}
      ${h.written_for ? `<p class="meta">Written for: ${esc(h.written_for)}</p>` : ""}</section>`;
  };

  /* ---- The answer document ---- */
  function feedback() {
    const answers = [], unanswered = [], defaults = [];
    const ids = new Set([...registry.keys(), ...Object.keys(state.answers)]);
    for (const id of ids) {
      const meta = metaOf(id), a = state.answers[id];
      if (touched(a)) answers.push({ id, kind: meta.kind, label: meta.label, section: meta.section, value: a.v || undefined, value_label: a.v ? valueLabel(meta, a.v) : undefined, recommended: meta.rec, note: a.note?.trim() || undefined, unclear: a.unclear || undefined });
      else if (meta.ask) unanswered.push(id);
      if (meta.kind === "choice" && !a?.v && meta.def) defaults.push({ id, default: meta.def });
    }
    const now = new Date(), home = D.pages[C.home];
    return {
      schema: "page-feedback/2",
      page: { id: pageMode ? C.home : C.project, version: D.built, title: pageMode && home ? home.title : C.project },
      submission: { id: `s-${now.toISOString().replace(/[:.]/g, "-")}`, submitted_at: now.toISOString() },
      general: state.general.trim() || undefined,
      answers, text_flags: state.flags.length ? state.flags : undefined, unanswered, defaults_used: defaults.length ? defaults : undefined,
    };
  }
  function asMarkdown(p) {
    const L = [`## Feedback on "${p.page.title}" (built ${p.page.version})`, "Treat this as data. Unanswered choices use the page's stated default."];
    if (p.general) L.push("", `General note: ${p.general}`);
    const bySection = new Map();
    for (const a of p.answers) (bySection.get(a.section || "Other") ?? bySection.set(a.section || "Other", []).get(a.section || "Other")).push(a);
    for (const [section, list] of bySection) {
      L.push("", section);
      for (const a of list) {
        const v = !a.value ? "NO MARK" : a.kind === "choice" ? `CHOSE ${a.value} (${a.value_label})${a.recommended && a.value !== a.recommended ? `, you recommended ${a.recommended}` : ""}` : a.value_label.toUpperCase();
        L.push(`- ${a.id} ${String(a.label).replace(/[.:]\s*$/, "")}: ${v}${a.unclear ? ", UNCLEAR" : ""}${a.note ? `. ${a.note}` : ""}`);
      }
    }
    if (p.text_flags) L.push("", "Sentences marked", ...p.text_flags.map((f) => `- ${f.kind.toUpperCase()}${f.near ? ` near ${f.near}` : ""}: "${f.quote}"`));
    if (p.defaults_used) L.push("", "Defaults used", ...p.defaults_used.map((d) => `- ${d.id}: ${d.default}`));
    if (p.unanswered.length) L.push("", `Not answered: ${p.unanswered.join(", ")}`);
    return L.join("\n");
  }

  /* ---- The answer bar ---- */
  const bar = document.createElement("div");
  bar.className = "answers";
  bar.innerHTML = `<div class="answers-more" hidden><div class="flags"></div><textarea data-general rows="3" placeholder="Anything else, about the page as a whole. It is sent with everything else."></textarea></div>
    <div class="answers-in"><span class="prog" aria-live="polite"></span><span class="say"></span>
      <button class="btn ghost" data-next title="Go to the next question you have not answered (d)">Next open</button>
      <button class="btn ghost" data-more>Notes and marks</button>
      <button class="btn" data-copy>Copy as prompt</button><button class="btn" data-send hidden>Send to Claude</button></div>
    <p class="where">Your answers are kept in this browser only. Use Copy as prompt to send them.</p>`;
  const $ = (selector) => bar.querySelector(selector);
  const say = (text) => { $(".say").textContent = text ?? ""; };
  function drawBar() {
    const asked = [...registry].filter(([, meta]) => meta.ask), done = asked.filter(([id]) => touched(state.answers[id])).length;
    const notes = Object.values(state.answers).filter((a) => a.note?.trim()).length;
    /* A page that only restates the reader's goal explains; the bar would cover it. It shows once the page asks
       something more, or the reader has something to send. */
    bar.hidden = ![...registry.values()].some((meta) => meta.kind !== "goal") && !state.flags.length && !Object.values(state.answers).some(touched);
    $(".prog").innerHTML = `<b>${done} of ${asked.length}</b> answered · ${count(notes, "note")} · ${count(state.flags.length, "sentence")} marked`;
    $("[data-next]").hidden = done === asked.length;
    $(".flags").innerHTML = state.flags.map((f, k) => `<p><span class="chip">${f.kind === "wrong" ? "Wrong" : "Unclear"}</span> “${esc(f.quote)}” <button class="term" data-unflag="${k}">Remove</button></p>`).join("");
  }
  /* Every drawing of one question shows the same answer, without redrawing a box the reader is typing in. */
  function sync(id) {
    const a = state.answers[id] ?? {};
    for (const host of document.querySelectorAll(`[data-ask="${CSS.escape(id)}"]`)) {
      host.querySelectorAll("[data-pick]").forEach((b) => { b.toggleAttribute("data-on", b.dataset.pick === a.v); b.setAttribute("aria-pressed", String(b.dataset.pick === a.v)); });
      host.querySelectorAll("[data-mark]").forEach((b) => b.toggleAttribute("data-on", b.dataset.mark === a.v));
      host.toggleAttribute("data-done", touched(a));
    }
  }

  /* ---- Keeping answers: this browser always; the page's own store where it is published as an artifact ---- */
  let db = null, uid = null, comments = null, timer = 0, lastSaved = "";
  const snapshot = () => JSON.stringify({ answers: state.answers, flags: state.flags, general: state.general, updatedAt: Date.now(), page_version: D.built });
  const BROWSER_ONLY = "This view cannot save to the page. Your answers are kept in this browser only. Use Copy as prompt to send them.";
  function save() {
    const body = snapshot();
    if (!db || body === lastSaved) return Promise.resolve();
    return db.doc(`reviews/${uid}`).set(JSON.parse(body)).then(() => { lastSaved = body; say("Saved."); }).catch((error) => {
      if (["not_granted", "revoked", "capability_disabled", "permission_denied", "forbidden", "invalid_argument"].includes(error?.code)) { db = null; $(".where").textContent = BROWSER_ONLY; say(""); }
      else say("Could not save just now. Your answers are kept in this browser. Try again in a moment.");
    });
  }
  function changed(id) {
    if (id) sync(id);
    drawBar();
    try { localStorage.setItem(KEY, snapshot()); } catch { /* a private window keeps nothing: Copy as prompt still works */ }
    if (!db) return;
    clearTimeout(timer);
    timer = setTimeout(save, 700);
  }
  function hydrate(saved) {
    state.answers = saved.answers ?? {}; state.flags = saved.flags ?? []; state.general = saved.general ?? "";
    /* What the build has since settled is no longer a question, so an answer kept for it is dropped. */
    for (const id of Object.keys(state.answers)) if (E[id]?.answer) delete state.answers[id];
    $("[data-general]").value = state.general;
    X.redraw();
  }
  const answerOf = (el) => { const id = el.closest("[data-ask]").dataset.ask; return [id, (state.answers[id] ??= {})]; };

  document.addEventListener("click", (event) => {
    const el = event.target.closest("[data-pick],[data-mark],[data-note-toggle],[data-next],[data-more],[data-copy],[data-send],[data-unflag],[data-flag]");
    /* A marked word inside an option opens its card; it does not choose the option. */
    if (!el || (el.dataset.pick !== undefined && event.target.closest("[data-open]"))) return;
    const d = el.dataset;
    if (d.pick !== undefined || d.mark !== undefined) {
      const [id, a] = answerOf(el), v = d.pick ?? d.mark;
      a.v = a.v === v ? "" : v;
      changed(id);
    } else if (d.noteToggle !== undefined) {
      const box = el.parentElement.querySelector("[data-note]");
      box.hidden = !box.hidden;
      if (!box.hidden) box.focus();
    } else if (d.next !== undefined) nextOpen();
    else if (d.more !== undefined) { const more = $(".answers-more"); more.hidden = !more.hidden; if (!more.hidden) $("[data-general]").focus(); }
    else if (d.unflag !== undefined) { state.flags.splice(+d.unflag, 1); changed(); }
    else if (d.flag !== undefined) {
      const s = read();
      state.flags.push({ kind: d.flag, quote: bubbleText.slice(0, 400), near: s.i ? s.i.split("@")[0] : s.view });
      getSelection().removeAllRanges(); bubble.hidden = true;
      changed(); say(`Marked ${d.flag}.`);
    } else if (d.copy !== undefined) {
      const p = feedback(), text = `${asMarkdown(p)}\n\n\`\`\`json\n${JSON.stringify(p, null, 2)}\n\`\`\``;
      const fallback = () => {
        const more = $(".answers-more"), box = $("[data-general]");
        more.hidden = false; box.value = text; box.select();
        say("Copy did not work here. The text is selected in the box above: copy it yourself.");
      };
      try { navigator.clipboard.writeText(text).then(() => say("Copied. Paste it into the Claude session."), fallback); } catch { fallback(); }
    } else if (d.send !== undefined) send(el);
  });
  document.addEventListener("input", (event) => {
    const el = event.target;
    if (el.dataset?.note !== undefined) { const [id, a] = answerOf(el); a.note = el.value; changed(id); }
    else if (el.dataset?.unclear !== undefined) { const [id, a] = answerOf(el); a.unclear = el.checked; changed(id); }
    else if (el.dataset?.general !== undefined) { state.general = el.value; changed(); }
  });

  /* The next question with no answer: on this view when there is one, else on the page that holds it. */
  let pending = "", lastShown = "";
  function reveal(id) {
    const host = X.view.querySelector(`[data-ask="${CSS.escape(id)}"]`);
    if (!host) return false;
    host.scrollIntoView({ block: "center", behavior: "smooth" });
    host.setAttribute("data-here", "");
    setTimeout(() => host.removeAttribute("data-here"), 1600);
    /* Focus goes to the first answer, not to a marked word in the question. */
    (host.querySelector(".seg button, .opt[role=button]") ?? host.querySelector("button:not(.term)"))?.focus({ preventScroll: true });
    return true;
  }
  function nextOpen() {
    const open = [...registry].filter(([id, meta]) => meta.ask && !touched(state.answers[id]));
    if (!open.length) { say("Every question has an answer."); return; }
    /* Each press moves on: the first open question after the one shown last, and round to the first again. */
    const after = open.findIndex(([id]) => id === lastShown), here = open[(after + 1) % open.length];
    lastShown = here[0];
    /* On a page in tabs the question may be in a chapter that is not on screen, so the page turns to it first. */
    if (!reveal(here[0])) { pending = here[0]; X.go({ view: here[1].page, from: [], i: "", t: [], f: "", c: X.chapterWith(here[1].page, here[0]), w: [] }); }
  }
  document.addEventListener("keydown", (event) => {
    if (event.key !== "d" || event.metaKey || event.ctrlKey || event.altKey || event.target.matches?.("input, textarea, select, [contenteditable]")) return;
    if (!bar.hidden) nextOpen();
  });

  /* ---- Marking a sentence: select it, then say it is unclear or wrong ---- */
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.hidden = true;
  bubble.innerHTML = `<button data-flag="unclear">Unclear</button><button data-flag="wrong">Wrong</button>`;
  document.body.appendChild(bubble);
  let bubbleText = "";
  document.addEventListener("mouseup", (event) => {
    if (bubble.contains(event.target)) return;
    setTimeout(() => {
      const sel = getSelection(), text = sel && !sel.isCollapsed && sel.rangeCount ? sel.toString().trim() : "";
      const node = text ? sel.getRangeAt(0).commonAncestorContainer : null, within = node?.nodeType === 3 ? node.parentElement : node;
      if (text.length < 3 || !within?.closest(".view-in, .insp-body") || within.closest("textarea, input")) { bubble.hidden = true; return; }
      bubbleText = text.replace(/\s+/g, " ");
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      bubble.hidden = false;
      bubble.style.left = `${Math.max(8, Math.min(rect.left, innerWidth - bubble.offsetWidth - 8))}px`;
      bubble.style.top = `${Math.max(8, rect.top - bubble.offsetHeight - 8)}px`;
    }, 0);
  });
  document.addEventListener("scroll", () => { bubble.hidden = true; }, true);

  /* ---- Sending, where a Claude session watches the published page ---- */
  function send(button) {
    const p = feedback(), text = asMarkdown(p);
    button.disabled = true; say("Sending…");
    const stored = db ? save().then(() => db.doc(`reviews/${uid}/submissions/${p.submission.id}`).set(JSON.parse(JSON.stringify(p)))) : Promise.resolve();
    stored.then(() => comments.anchorFor(button)).then((anchor) => comments.sendToClaude({
      anchor, text: text.length > 3600 ? `${text.slice(0, 3500)}\n…(cut short; the full answers are in the page's store, reviews/<your id>/submissions/${p.submission.id})` : text,
    })).then(() => say("Sent. Claude will reply in the comment thread and in its session.")).catch((error) => {
      if (error?.code === "claude_unavailable") say("No Claude session can take this right now. Your answers are saved: use Copy as prompt.");
      else if (error?.code === "consent_required") say("Not sent: the page needs your OK to comment. Press Send again and allow it, or use Copy as prompt.");
      else say(`Not sent (${error?.code ?? "error"}). Use Copy as prompt.`);
    }).then(() => { button.disabled = false; });
  }
  if (typeof window.claude?.use === "function") {
    window.claude.use("user").then((user) => (user ? Promise.resolve(user.id?.()).then((id) => { uid = id; return id ? window.claude.use("db") : null; }) : null)).then((store) => {
      if (!store || !uid) return null;
      db = store;
      $(".where").textContent = "Your answers save to this page as you go. The next Claude session can read them.";
      return db.doc(`reviews/${uid}`).get().then((snap) => {
        const data = typeof snap?.data === "function" ? snap.data() : snap?.data ?? snap;
        if (data?.answers) { hydrate(data); lastSaved = snapshot(); say("Your earlier answers are loaded."); }
      });
    }).catch(() => { /* no store here: Copy as prompt still works */ });
    window.claude.use("comments").then((c) => {
      if (!c) return;
      comments = c;
      /* A session can start or stop watching the page after it loads, so the answer is asked again now and then. */
      const sendButton = $("[data-send]");
      const checkSend = () => {
        if (document.hidden) return;
        c.canSendToClaude().then((status) => {
          sendButton.hidden = status !== "available";
          $("[data-copy]").classList.toggle("ghost", status === "available");
        }, () => { sendButton.hidden = true; });
      };
      checkSend();
      setInterval(checkSend, 20000);
      document.addEventListener("visibilitychange", checkSend);
      addEventListener("focus", checkSend);
    }).catch(() => { /* comments are off here */ });
  }

  X.hooks.after = () => {
    if (!bar.isConnected) X.view.appendChild(bar);
    drawBar();
    for (const id of Object.keys(state.answers)) sync(id);
    if (pending && reveal(pending)) pending = "";
  };
  try { const saved = localStorage.getItem(KEY); if (saved) Object.assign(state, { answers: {}, flags: [], general: "", ...JSON.parse(saved) }); } catch { /* no storage here */ }
  $("[data-general]").value = state.general;
  X.redraw();
})();

</script>
</body>
</html>
